{% extends 'base.html' %}
{% load static %}

{% block title %}رسالة جديدة{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <h4 class="mb-0"><i class="bi bi-envelope-plus"></i> رسالة جديدة</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% if not recipient %}
                        <div class="mb-3">
                            <label class="form-label">المستلم *</label>
                            <select name="recipient_id" class="form-select" required>
                                <option value="">اختر المستلم</option>
                                {% for u in users %}
                                <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }} ({{ u.username }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% else %}
                        <div class="mb-3">
                            <label class="form-label">المستلم</label>
                            <input type="text" class="form-control" value="{{ recipient.get_full_name|default:recipient.username }}" readonly disabled>
                            <input type="hidden" name="recipient_id" value="{{ recipient.id }}">
                        </div>
                        {% endif %}

                        {% if property %}
                        <div class="mb-3">
                            <label class="form-label">بخصوص العقار</label>
                            <input type="text" class="form-control" value="{{ property.title }}" readonly disabled>
                            <input type="hidden" name="property_id" value="{{ property.id }}">
                        </div>
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label">الموضوع *</label>
                            <input type="text" name="subject" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الرسالة *</label>
                            <textarea name="body" rows="6" class="form-control" required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> إرسال</button>
                            <a href="{% url 'accounts:inbox' %}" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
