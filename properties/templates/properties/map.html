<!-- properties/templates/properties/map.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}خريطة العقارات - عقاري{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
    #map {
        height: calc(100vh - 150px);
        width: 100%;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .map-header {
        background: linear-gradient(135deg, #1a2c3e 0%, #2d4a6e 100%);
        padding: 1.5rem 0;
        color: white;
        margin-bottom: 1.5rem;
        border-radius: 0 0 30px 30px;
    }
    .custom-popup .property-title {
        font-weight: bold;
        font-size: 1rem;
        margin-bottom: 0.3rem;
    }
    .custom-popup .property-price {
        color: #2ecc71;
        font-weight: bold;
    }
    .custom-popup .property-wilaya {
        color: #64748b;
        font-size: 0.8rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="map-header">
    <div class="container">
        <h1 class="fw-bold mb-2"><i class="fas fa-map-marked-alt me-3"></i> خريطة العقارات</h1>
        <p class="opacity-75">استعرض جميع العقارات المتوفرة على الخريطة</p>
    </div>
</div>

<div class="container mb-5">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
    // تهيئة الخريطة
    var map = L.map('map').setView([28.5, 2.5], 5);

    // إضافة طبقة الخريطة
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; CartoDB',
        subdomains: 'abcd',
        maxZoom: 19,
        minZoom: 3
    }).addTo(map);

    // تجميع العلامات
    var markers = L.markerClusterGroup();

    // بيانات العقارات
    var properties = {{ properties_json|safe }};

    // إضافة العلامات
    properties.forEach(function(prop) {
        if (prop.lat && prop.lng) {
            var popupContent = `
                <div class="custom-popup" style="min-width: 200px;">
                    <div class="property-title">🏠 ${prop.title}</div>
                    <div class="property-price">💰 ${prop.price.toLocaleString()} دج</div>
                    <div class="property-wilaya">📍 ${prop.wilaya}</div>
                    <hr class="my-2">
                    <a href="/properties/detail/${prop.id}/" class="btn btn-sm btn-primary rounded-pill w-100">عرض التفاصيل</a>
                </div>
            `;

            var marker = L.marker([prop.lat, prop.lng])
                .bindPopup(popupContent);

            markers.addLayer(marker);
        }
    });

    // إضافة العلامات إلى الخريطة
    map.addLayer(markers);

    // تكبير الخريطة لتناسب جميع العلامات إذا وجدت
    if (properties.length > 0) {
        var bounds = markers.getBounds();
        if (bounds.isValid()) {
            map.fitBounds(bounds);
        }
    }
</script>
{% endblock %}
